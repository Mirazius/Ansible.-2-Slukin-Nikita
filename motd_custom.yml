---
- name: Задание 2 - Динамическое MOTD с фактами системы
  hosts: servers
  become: true

  tasks:
    - name: Сформировать динамическое сообщение MOTD
      copy:
        content: |
          ========================================
          Сервер: {{ ansible_hostname }}
          IP адрес: {{ ansible_default_ipv4.address }}
          
          Хорошего дня, системный администратор!
          ========================================
        dest: /etc/motd
        mode: '0644'
