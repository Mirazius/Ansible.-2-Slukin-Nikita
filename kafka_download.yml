---
- name: Задание 1.1 - Скачать и распаковать Apache Kafka
  hosts: servers
  become: true
  vars:
    kafka_version: "3.8.0"
    kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
    kafka_dest_dir: "/opt/kafka"
    kafka_archive: "/tmp/kafka_{{ kafka_version }}.tgz"

  tasks:
    - name: Создать директорию для Kafka
      file:
        path: "{{ kafka_dest_dir }}"
        state: directory
        mode: '0755'

    - name: Скачать архив Kafka
      get_url:
        url: "{{ kafka_url }}"
        dest: "{{ kafka_archive }}"
        mode: '0644'

    - name: Распаковать архив в директорию
      unarchive:
        src: "{{ kafka_archive }}"
        dest: "{{ kafka_dest_dir }}"
        remote_src: yes
        creates: "{{ kafka_dest_dir }}/libs"

    - name: Удалить временный архив
      file:
        path: "{{ kafka_archive }}"
        state: absent

